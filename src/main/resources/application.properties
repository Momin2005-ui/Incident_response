spring.application.name=CLS

spring.datasource.url=jdbc:postgresql://localhost:5432/cls
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# Where the log file lives
logging.file.name=logs/application.log

# Pattern: timestamp | level | requestId (from MDC) | logger | message
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n

logging.level.root=INFO
logging.level.com.cloud_forensic_system.CLS=INFO

# Roll the file so it doesn't grow forever during testing
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
