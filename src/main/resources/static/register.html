<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - CLS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-top: 100px; max-width: 400px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

<div class="card shadow">
    <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Cloud Log System</h3>
        <h5 class="text-center text-muted mb-4">Register</h5>

        <div id="alert-box"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="registerUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="registerUsername" name="name" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
                <label for="registerPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="registerPassword" name="password" placeholder="Choose a password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-success">Register</button>
            </div>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script src="/script.js"></script>
</body>
</html>
