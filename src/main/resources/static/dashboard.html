<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Analysis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .card { margin-bottom: 20px; }
        .template-code { font-family: monospace; font-size: 0.9em; background: #eee; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <h1 class="mb-4">Automated Log Analysis Dashboard</h1>
    
    <div class="row mb-4">
        <div class="col-md-12">
            <button class="btn btn-secondary" onclick="simulateIncident()">1. Simulate Flash Sale Incident</button>
            <button class="btn btn-primary" onclick="analyzeLogs()">2. Run Analysis on Log File</button>
            <span id="analysis-status" class="ms-3 text-success"></span>
        </div>
    </div>

    <div class="row">
        <!-- Compression Stats -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-info text-white">Compression Statistics</div>
                <div class="card-body">
                    <p><strong>Algorithm:</strong> <span id="comp-algo"></span></p>
                    <p><strong>Original Size:</strong> <span id="comp-orig"></span></p>
                    <p><strong>Compressed Size:</strong> <span id="comp-comp"></span></p>
                    <h4 class="text-success" id="comp-ratio"></h4>
                </div>
            </div>
        </div>

        <!-- Anomalies -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">Detected Anomalies (Z-Score)</div>
                <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-striped table-sm">
                        <thead>
                            <tr>
                                <th>Window Start</th>
                                <th>Score</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="anomalies-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Templates -->
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-secondary text-white">Log Templates (Drain Parser)</div>
                <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-striped table-hover table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Occurrences</th>
                                <th>Pattern</th>
                            </tr>
                        </thead>
                        <tbody id="templates-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function fetchStats() {
        try {
            const [statsRes, templatesRes, anomaliesRes] = await Promise.all([
                fetch('/api/logs/stats/compression'),
                fetch('/api/logs/templates'),
                fetch('/api/logs/anomalies')
            ]);
            
            const stats = await statsRes.json();
            const templates = await templatesRes.json();
            const anomalies = await anomaliesRes.json();
            
            // Populate stats
            document.getElementById('comp-algo').innerText = stats.algorithm;
            document.getElementById('comp-orig').innerText = stats.originalSize;
            document.getElementById('comp-comp').innerText = stats.compressedSize;
            document.getElementById('comp-ratio').innerText = "Ratio: " + stats.compressionRatio;
            
            // Populate templates
            const tmplTbody = document.getElementById('templates-table');
            tmplTbody.innerHTML = '';
            // Sort templates by occurrences descending
            templates.sort((a,b) => b.occurrenceCount - a.occurrenceCount).forEach(t => {
                tmplTbody.innerHTML += `<tr>
                    <td>${t.id}</td>
                    <td>${t.occurrenceCount}</td>
                    <td class="template-code">${t.pattern.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</td>
                </tr>`;
            });
            
            // Populate anomalies
            const anomTbody = document.getElementById('anomalies-table');
            anomTbody.innerHTML = '';
            anomalies.forEach(a => {
                anomTbody.innerHTML += `<tr>
                    <td>${a.windowStart}</td>
                    <td><span class="badge bg-warning text-dark">${a.score.toFixed(2)}</span></td>
                    <td style="font-size: 0.85em;">${a.details}</td>
                </tr>`;
            });
            
        } catch (e) {
            console.error("Error fetching dashboard data", e);
        }
    }

    async function analyzeLogs() {
        document.getElementById('analysis-status').innerText = 'Analyzing...';
        try {
            const res = await fetch('/api/logs/analyze', { method: 'POST' });
            const data = await res.json();
            document.getElementById('analysis-status').innerText = data.message;
            fetchStats();
        } catch (e) {
            document.getElementById('analysis-status').innerText = 'Error occurred.';
        }
    }
    
    async function simulateIncident() {
        document.getElementById('analysis-status').innerText = 'Simulating incident...';
        try {
            const res = await fetch('/api/logs/simulate-incident', { method: 'POST' });
            const data = await res.json();
            document.getElementById('analysis-status').innerText = data.message;
        } catch (e) {
            document.getElementById('analysis-status').innerText = 'Error occurred during simulation.';
        }
    }

    // Initial fetch
    fetchStats();
</script>

</body>
</html>
